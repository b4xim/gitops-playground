{{- if .Values.redis.auth.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gitops-playground.fullname" . }}-redis-secret
  labels:
    {{- include "gitops-playground.labels" . | nindent 4 }}
type: Opaque
data:
  REDIS_PASSWORD: {{ .Values.redis.auth.password | b64enc | quote }}
{{- end }}
