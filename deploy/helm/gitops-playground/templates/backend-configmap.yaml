apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gitops-playground.fullname" . }}-backend-config
  labels:
    {{- include "gitops-playground.backendSelectorLabels" . | nindent 4 }}
data:
  APP_VERSION: {{ .Values.backend.config.appVersion | quote }}
  APP_ENV: {{ .Values.backend.config.appEnv | quote }}
  THEME_COLOR: {{ .Values.backend.config.themeColor | quote }}
  WELCOME_MESSAGE: {{ .Values.backend.config.welcomeMessage | quote }}
  REDIS_HOST: {{ include "gitops-playground.fullname" . }}-redis
  REDIS_PORT: {{ .Values.redis.service.port | quote }}
  PORT: {{ .Values.backend.service.port | quote }}
