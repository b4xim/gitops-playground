apiVersion: v1
kind: Service
metadata:
  name: {{ include "gitops-playground.fullname" . }}-redis
  labels:
    {{- include "gitops-playground.redisSelectorLabels" . | nindent 4 }}
spec:
  type: {{ .Values.redis.service.type }}
  ports:
    - port: {{ .Values.redis.service.port }}
      targetPort: redis
      protocol: TCP
      name: redis
  selector:
    {{- include "gitops-playground.redisSelectorLabels" . | nindent 4 }}
